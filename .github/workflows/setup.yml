name: Initialize from template

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  setup:
    if: github.repository != 'Corintis/coding_project_template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already initialized
        id: check
        run: |
          if [ ! -f ".template-marker" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename package
        if: steps.check.outputs.skip == 'false'
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          NEW_NAME="${REPO_NAME//-/_}"
          HYPHENATED="${REPO_NAME//_/-}"

          echo "Initializing project: package_name -> ${NEW_NAME}, package-name -> ${HYPHENATED}"

          mv "src/package_name" "src/${NEW_NAME}"

          find . -type f \
              -not -path './.git/*' \
              -not -path './.github/workflows/setup.yml' \
              | while read -r file; do
            if grep -qI . "$file"; then
              sed -i "s/package_name/${NEW_NAME}/g" "$file"
              sed -i "s/package-name/${HYPHENATED}/g" "$file"
            fi
          done

          rm .template-marker
          rm .github/workflows/setup.yml

      - name: Commit changes
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize project from template"
          git push
