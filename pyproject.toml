[project]
name = "package-name"
description = "TODO: describe your project"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff==0.15.4",
    "mypy==2.1.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "coverage==7.14.0",
    "pre-commit==4.6.0",
    "yamllint==1.38.0",
    "setuptools_scm==10.0.5",
]

[build-system]
requires = [
    "setuptools>=75.0",
    "setuptools_scm==10.0.5",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["build/"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
    "assert_never\\(",
]
exclude_also = [
    '@(abc\.)?abstractmethod',
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle (flake8-docstrings)
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T",   # flake8-type-checking (typing imports)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "I",   # isort
    "YTT", # flake8-2020
    "ASYNC", # async usages
    "T10", # flake8-debugger
    "RSE", # flake8-raise
    "ARG", # flake8-unused-args
    "PL",  # pylint
    "PTH", # flake8-use-pathlib
    "PGH", # pygrep-hooks
    "SLF", # flake8-self
    "PYI", # flake8-pyi
    "PIE", # flake8-pie
    "C90", # mccabe complexity
    "RUF", # ruff-specific rules
    "FURB", # refurb
    "TRY", # tryceratops
    "RET", # flake8-return
    "PERF", # perflint
    "LOG", # flake8-logging
]
ignore = [
    "C408",  # flake8-comprehensions: Unnecessary dict/list/tuple call
    "D400",  # pydocstyle: First line should end with period
    "D401",  # pydocstyle: First line should be imperative mood
    "D404",  # pydocstyle: First word should not be "This"
    "D411",  # pydocstyle: Missing blank line before class docstring
    "D413",  # pydocstyle: Missing blank line after last section
    "D203",  # pydocstyle: No blank lines before class docstring
    "D213",  # pydocstyle: Multi-line summary should start at line 2
    "D105",  # pydocstyle: Missing magic method docstring
    "D107",  # pydocstyle: Missing __init__ docstring
    "D415",  # pydocstyle: First line punctuation formatting
    "D417",  # pydocstyle: Missing parameter documentation
    "E501",  # pycodestyle: Line too long (handled by line-length)
    "D205",  # pydocstyle: Blank line between summary/description
    "D212",  # pydocstyle: Multi-line summary should start at line 1
    "E701",  # pycodestyle: Multiple statements on one line (colon)
    "N806",  # pep8-naming: Non-lowercase variable in function
    "N802",  # pep8-naming: Invalid function name
    "N803",  # pep8-naming: Invalid argument name
    "S603",  # bandit: subprocess call without shell=True
    "S607",  # bandit: Starting process with partial path
    "PLR2004", # pylint: Magic value used in comparison
    "PLR0913", # pylint: Too many arguments
    "PTH123",  # flake8-use-pathlib: prefer Path.open() over open()
    "RUF005", # ruff: list concatenation preference
    "PIE808", # pie: unnecessary start argument in range
    "PIE790", # pie: unnecessary pass statement
    "FURB110", # refurb: prefers ternary over or
    "FURB122", # refurb: use of f.write in a for loop
    "TRY003", # tryceratops: avoid long messages outside exception class
    "RET504", # flake8-return: unnecessary assignment before return
    "RET505", # flake8-return: unnecessary else after return statement
    "RET506", # flake8-return: unnecessary else after raise statement
    "RET508", # flake8-return: unnecessary else after break statement
    "PERF401", # perflint: use a list comprehension to create a transformed list
    "PERF403", # perflint: use a dict comprehension instead of a for loop
    "PERF203", # perflint: try-except in a for loop
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["D103", "D100", "D102", "D101", "S101", "T201", "D417", "PLR0913", "SLF"]
"**/test_*.py" = ["D103", "D100", "D102", "D101", "S101", "T201", "D417", "PLR0913", "SLF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# These settings approximate Black's import style
force-sort-within-sections = true
case-sensitive = true
force-wrap-aliases = true
split-on-trailing-comma = true
order-by-type = true
lines-after-imports = 2
known-first-party = ["tests"]
